[project]
name = "out-loud"
version = "0.1.0"
description = "Local voice sanitizer – strips filler words from live speech"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4",
    "vosk>=0.3.44,<0.3.45",
    "silero-vad>=5.1",
]

[project.scripts]
out-loud = "voice_sanitizer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_sanitizer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
